# Full mode overlay. Use through scripts/start-full.ps1 so the eight required
# parquet files are validated before Docker starts.
services:
  ml:
    build:
      context: .
      dockerfile: deploy/ml.Dockerfile
    restart: unless-stopped
    init: true
    command:
      - python
      - outputs/ml-service/service.py
      - --prepared
      - /data/prepared
      - --config
      - outputs/ml-dataset/dataset-config.json
      - --decision
      - outputs/ml-baseline-v2/decision.json
      - --directory
      - /ml/reference/channels.csv
      - --object-decision
      - outputs/ml-baseline-v2/run-008-incident72/object-decision.json
      - --object-decision
      - outputs/ml-baseline-v2/run-009-neispraven168/object-decision.json
      - --pump-decision
      - outputs/ml-pumps/run-005/pump-decision.json
      # Serves GET /quality (model-quality metrics for the frontend tab).
      - --quality
      - outputs/ml-baseline-v2/validate-stability.json
      - --host
      - 0.0.0.0
      - --port
      - "8090"
      - --demo-anchor
      - ${ML_DEMO_ANCHOR:-2026-06-20T00:00:00}
    volumes:
      - type: bind
        source: ${ML_DATA_DIR:-./ml-data}
        target: /data/prepared
        read_only: true
    expose:
      - "8090"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 30s
    networks:
      - backend

  app:
    environment:
      ML_PREDICTOR_URL: http://ml:8090
    # Full startup performs real sensor and facility inference before FastAPI
    # declares readiness. Keep the container in "starting" rather than
    # incorrectly marking it unhealthy while that bounded warm-up runs.
    healthcheck:
      start_period: 15m
    depends_on:
      ml:
        condition: service_healthy
        restart: true
