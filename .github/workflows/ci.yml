name: CI

on:
  push:
    branches:
      - master
      - main
      - "integration/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and accessibility tests
        run: npm test -- --run
      - name: Production build
        run: npm run build
      - name: Sites compatibility tests
        run: npm run test:sites
      - name: Production dependency audit
        run: npm audit --omit=dev

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mkl
          POSTGRES_PASSWORD: mkl
          POSTGRES_DB: contour_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mkl -d contour_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://mkl:mkl@127.0.0.1:5432/contour_ci
      APP_ENV: test
      ML_PREDICTOR_URL: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Apply migrations
        run: alembic upgrade head
      - name: Run backend tests
        run: pytest -q

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Lite configuration
        run: docker compose --project-name contour-ci-lite -f docker-compose.yml config --quiet
      - name: Validate Full configuration
        run: docker compose --project-name contour-ci-full -f docker-compose.yml -f docker-compose.ml.yml config --quiet
      - name: Validate Preview configuration
        run: docker compose --project-name contour-ci-full -f docker-compose.yml -f docker-compose.ml.yml -f docker-compose.preview.yml config --quiet
