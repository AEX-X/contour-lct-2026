services:
  preview-gateway:
    image: nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: "no"
    entrypoint: ["nginx", "-g", "daemon off;"]
    user: "101:101"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev,uid=101,gid=101
    volumes:
      - ./proxy/preview-nginx.conf:/etc/nginx/nginx.conf:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    depends_on:
      proxy:
        condition: service_healthy
    networks:
      - edge

  preview:
    build:
      context: .
      dockerfile: deploy/preview-tunnel.Dockerfile
    restart: "no"
    command:
      - -T
      - -o
      - BatchMode=yes
      - -o
      - ExitOnForwardFailure=yes
      - -o
      - ServerAliveInterval=30
      - -o
      - ServerAliveCountMax=3
      - -o
      - StrictHostKeyChecking=accept-new
      - -o
      - UserKnownHostsFile=/tmp/known_hosts
      - -R
      - 80:preview-gateway:8080
      - nokey@localhost.run
      - --
      - --output
      - json
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    depends_on:
      preview-gateway:
        condition: service_healthy
    networks:
      - edge
